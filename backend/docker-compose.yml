# Simple - Docker Compose
# Usage: docker-compose up

version: '3.8'

services:
  # ===========================================
  # Neo4j Database
  # ===========================================
  neo4j:
    image: neo4j:5.13.0
    container_name: Simple-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - Simple-network

  # ===========================================
  # Python Backend
  # ===========================================
  backend:
    build: ./backend
    container_name: Simple-backend
    ports:
      - "5050:5050"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MODEL_PATH=/app/models/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
      - EMBEDDINGS_PATH=/app/models/miniLM
    volumes:
      - ./backend:/app
      - ./models:/app/models:ro
      - ./exports:/app/exports
      - ./reports:/app/reports
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - Simple-network

  # ===========================================
  # React Frontend
  # ===========================================
  frontend:
    build: ./frontend
    container_name: Simple-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - Simple-network

# ===========================================
# Networks
# ===========================================
networks:
  Simple-network:
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  neo4j_data:
  neo4j_logs:
